<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Instrument Registry</title>
  <desc id="desc">Banner showing instrument records flowing into a generated master instrument list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#1b5e8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="125" font-size="56" font-weight="700">Instrument Registry</text>
    <text x="64" y="170" font-size="22" fill="#cbe4f5">YAML records are the source of truth.</text>
    <text x="64" y="202" font-size="22" fill="#cbe4f5">The fleet-wide master list is a rebuildable view.</text>
    <rect x="64" y="226" width="160" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <!-- Stack of per-unit records -->
  <g transform="translate(700 70)">
    <g fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5">
      <rect x="0" y="0" width="120" height="44" rx="8"/>
      <rect x="0" y="62" width="120" height="44" rx="8"/>
      <rect x="0" y="124" width="120" height="44" rx="8"/>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#ffffff" text-anchor="middle">
      <text x="60" y="27">instrument.yaml</text>
      <text x="60" y="89">instrument.yaml</text>
      <text x="60" y="151">instrument.yaml</text>
    </g>
    <text x="60" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbe4f5" text-anchor="middle">per-unit records</text>
  </g>

  <!-- Build step -->
  <g transform="translate(850 0)">
    <path d="M0 154H62" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 146L64 154L52 162" fill="none" stroke="#4fd1c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="130" font-family="Consolas, Menlo, monospace" font-size="13" fill="#4fd1c5" text-anchor="middle">validate</text>
    <text x="32" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#4fd1c5" text-anchor="middle">build</text>
  </g>

  <!-- Derived outputs -->
  <g transform="translate(940 90)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="url(#accent)"/>
    <rect x="0" y="20" width="200" height="10" fill="url(#accent)"/>
    <g stroke="#0f2742" stroke-opacity="0.2">
      <path d="M0 62H200M0 90H200M0 118H200"/>
      <path d="M70 30V130M135 30V130"/>
    </g>
    <g fill="#0f2742" fill-opacity="0.55">
      <rect x="10" y="40" width="48" height="8" rx="4"/>
      <rect x="80" y="40" width="40" height="8" rx="4"/>
      <rect x="145" y="40" width="40" height="8" rx="4"/>
      <rect x="10" y="68" width="48" height="8" rx="4"/>
      <rect x="80" y="68" width="30" height="8" rx="4"/>
      <rect x="145" y="68" width="36" height="8" rx="4"/>
      <rect x="10" y="96" width="48" height="8" rx="4"/>
      <rect x="80" y="96" width="44" height="8" rx="4"/>
      <rect x="145" y="96" width="28" height="8" rx="4"/>
    </g>
    <text x="100" y="21" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f2742" text-anchor="middle">master list</text>
  </g>
</svg>
